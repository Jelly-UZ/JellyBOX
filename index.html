<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jelly — подарок для тебя</title>
<meta name="description" content="Спасибо, что попробовал мармелад Jelly! Открой коробку и забери сладкий подарок.">
<meta name="theme-color" content="#fbd0e1">
<link rel="icon" href="assets/logo.png">
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/comfortaa-cyrillic.woff2" crossorigin>
<link rel="preload" as="image" href="assets/jelly-tail.webp">
<link rel="preload" as="image" href="assets/jelly-open.webp">
<style>
  /* Comfortaa (Google Fonts, OFL) — вариативный шрифт, один файл на все толщины; хранится в репозитории */
  @font-face {
    font-family: 'Comfortaa'; font-style: normal; font-weight: 300 700; font-display: swap;
    src: url(assets/fonts/comfortaa-cyrillic.woff2) format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: 'Comfortaa'; font-style: normal; font-weight: 300 700; font-display: swap;
    src: url(assets/fonts/comfortaa-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  :root {
    --pink: #f05a78;
    --magenta: #b8357f;
    --teal: #3bb6c5;
    --sky: #c3e7f7;
    --blush: #fbd0e1;
    --ink: #6b2346;
    --white: #fff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(120% 90% at 20% 10%, #fde3ee, #f6c3d8 60%, #c9e8f7);
    font-family: 'Comfortaa', system-ui, sans-serif; color: var(--ink);
    user-select: none; -webkit-user-select: none;
  }

  /* Сцена 9:16. На телефоне — на весь экран */
  .stage {
    position: relative; overflow: hidden; container-type: size;
    width: min(100vw, calc(100dvh * 9 / 16));
    height: min(100dvh, calc(100vw * 16 / 9));
    border-radius: 34px;
    box-shadow: 0 30px 80px rgba(184, 53, 127, .25), 0 0 0 6px #fff;
    background: var(--blush);
  }
  @media (max-aspect-ratio: 10/16) {
    .stage { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
  }

  /* ---------- Фон ---------- */
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bg .drift-a { animation: drift 9s ease-in-out infinite alternate; transform-origin: center; }
  .bg .drift-b { animation: drift 11s ease-in-out infinite alternate-reverse; transform-origin: center; }
  @keyframes drift { to { transform: translate(18px, -14px) scale(1.03); } }

  .float { position: absolute; pointer-events: none; animation: bob 4s ease-in-out infinite; }
  .float svg { width: 100%; height: 100%; display: block; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); }
    50% { transform: translateY(-2.2cqh) rotate(calc(var(--r, 0deg) + 6deg)); }
  }
  .dash { position: absolute; height: 1.1cqw; border-radius: 9px; animation: twinkle 2.6s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .35; transform: rotate(var(--r)) scaleX(.7); } 0%,100% { transform: rotate(var(--r)); } }

  /* ---------- HUD ---------- */
  .hud {
    position: absolute; top: max(2.4cqh, env(safe-area-inset-top)); left: 50%; translate: -50% 0; z-index: 20;
    display: flex; align-items: center; gap: 1.6cqw;
    padding: 1.4cqw 2.4cqw; border-radius: 99px;
    background: rgba(255,255,255,.85); border: 0.8cqw solid var(--teal);
    box-shadow: 0 0 0 0.9cqw #fff, 0 1.2cqw 3cqw rgba(184,53,127,.18);
  }
  .hud .step {
    width: 7.4cqw; height: 7.4cqw; border-radius: 50%; display: grid; place-items: center;
    font-size: 3.8cqw; background: #f3eef1; filter: grayscale(1); opacity: .55;
    transition: all .5s cubic-bezier(.3,1.6,.5,1);
  }
  .hud .step.on { background: linear-gradient(160deg, #ff8fa6, var(--pink)); filter: none; opacity: 1; transform: scale(1.12); }
  .hud .line { width: 5cqw; height: 0.8cqw; border-radius: 9px; background: #f3dbe5; overflow: hidden; }
  .hud .line i { display: block; height: 100%; width: 0; background: var(--pink); transition: width .6s ease; }
  .hud .line.on i { width: 100%; }

  /* ---------- Реплика ---------- */
  .bubble {
    position: absolute; z-index: 15; left: 6cqw; right: 6cqw; top: 11cqh;
    padding: 5.2cqw 5.4cqw 6.4cqw; border-radius: 7cqw;
    background: #fff; border: 1cqw solid var(--teal);
    box-shadow: 0 0 0 1.2cqw #fff, 0 2cqw 5cqw rgba(184,53,127,.22);
    font-size: 4.9cqw; line-height: 1.4; font-weight: 700; text-align: center;
    opacity: 0; transform-origin: 50% 120%;
  }
  .bubble::after { /* хвостик */
    content: ''; position: absolute; left: var(--tail, 50%); bottom: -4.6cqw; translate: -50% 0;
    width: 7cqw; height: 7cqw; background: #fff;
    border-right: 1cqw solid var(--teal); border-bottom: 1cqw solid var(--teal);
    border-bottom-right-radius: 1.6cqw; rotate: 45deg;
  }
  .bubble .name {
    position: absolute; top: -4.4cqw; left: 50%; transform: translateX(-50%); padding: 1cqw 3.6cqw 1.2cqw; border-radius: 99px;
    background: linear-gradient(160deg, #ff7d95, var(--magenta)); color: #fff; font-size: 3.6cqw;
    border: 0.8cqw solid #fff; box-shadow: 0 0 0 0.6cqw var(--teal);
  }
  .bubble .next {
    position: absolute; right: 4.4cqw; bottom: 2cqw; font-size: 3.2cqw; color: var(--teal); opacity: 0;
  }
  .bubble.wait .next { opacity: 1; animation: nudge .9s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(1cqw); } }
  .bubble .dots[hidden] { display: none; }
  .bubble .dots { display: flex; justify-content: center; gap: 1.6cqw; margin-top: 2.4cqw; }

  /* ---------- Переключатель языка ---------- */
  .lang {
    position: absolute; z-index: 25; right: 3.5cqw; top: calc(max(2.4cqh, env(safe-area-inset-top)) + 1.4cqw);
    display: flex; padding: 0.7cqw; border-radius: 99px;
    background: #fff; border: 0.7cqw solid var(--teal); box-shadow: 0 1cqw 2.4cqw rgba(184,53,127,.15);
  }
  .lang button {
    border: 0; background: none; cursor: pointer; padding: 1.2cqw 2.3cqw 1.4cqw; border-radius: 99px;
    font: 700 3.2cqw/1 'Comfortaa', sans-serif; color: var(--teal); transition: all .25s;
  }
  .lang button.on { background: linear-gradient(160deg, #ff7d95, var(--magenta)); color: #fff; }
  .bubble .dots i { width: 3.2cqw; height: 3.2cqw; border-radius: 50%; background: #f3dbe5; transition: all .3s cubic-bezier(.3,1.8,.5,1); }
  .bubble .dots i.on { background: var(--pink); transform: scale(1.25); }

  /* ---------- Сцена 1: Jelly ---------- */
  .scene { position: absolute; inset: 0; }
  .scene[hidden] { display: none; }

  .jelly {
    position: absolute; left: 50%; bottom: 7cqh;
    height: min(55cqh, 100cqw); aspect-ratio: 760 / 1121;
    transform-origin: 45% 100%; opacity: 0; /* центровку (xPercent) задаёт GSAP */
  }
  .jelly .part { position: absolute; inset: 0; }
  .jelly .part img { width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
  /* разметка assets/jelly-tail.webp (760×1121): коробка x 80–600 y 520–865, ноги ниже, хвост x>525 y<905.
     Тело обрезано по низу коробки (77.4%), ноги — отдельные слои ПОД телом, их верх уходит под коробку,
     поэтому линия разреза не видна, когда нога поднимается */
  .rig { position: absolute; inset: 0; transform-origin: 45% 100%; } /* наклон всей фигуры целиком */
  /* тело пружинит от низа коробки (77.4%) — стык с ногами не расходится */
  .j-body { clip-path: polygon(0 0, 100% 0, 100% 81%, 69% 81%, 69% 77.4%, 0 77.4%); transform-origin: 45% 77.4%; }
  .j-leg.l { clip-path: polygon(0 77%, 44.7% 77%, 44.7% 100%, 0 100%); transform-origin: 28% 99%; }
  .j-leg.r { clip-path: polygon(44.7% 77%, 69% 77%, 69% 80.7%, 100% 80.7%, 100% 100%, 44.7% 100%); transform-origin: 60% 99%; }
  .j-shadow {
    position: absolute; left: 14%; right: 24%; bottom: -2%; height: 5%;
    border-radius: 50%; background: radial-gradient(closest-side, rgba(184,53,127,.32), transparent);
  }
  .j-glow {
    position: absolute; left: 6%; right: 18%; top: 40%; height: 26%; border-radius: 50%; opacity: 0;
    background: radial-gradient(closest-side, #fff 0%, #fff6c9 35%, rgba(255,214,231,.6) 60%, transparent);
    mix-blend-mode: screen; pointer-events: none;
  }
  .box-hit {
    position: absolute; left: 10.5%; top: 46.4%; width: 68.5%; height: 30.8%;
    border: 0; background: none; padding: 0; cursor: pointer; display: none;
  }
  .box-hit.on { display: block; }
  .tap-ring {
    position: absolute; left: 50%; top: 50%; width: 22cqw; height: 22cqw; translate: -50% -50%;
    border-radius: 50%; border: 1cqw solid #fff; box-shadow: 0 0 0 1cqw var(--teal) inset;
    animation: ring 1.3s ease-out infinite; pointer-events: none;
  }
  .tap-ring + .tap-hand {
    position: absolute; left: 56%; top: 58%; font-size: 10cqw; pointer-events: none;
    animation: tap 1.3s ease-in-out infinite;
  }
  @keyframes ring { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
  @keyframes tap { 0%,100% { transform: translate(0,0) scale(1); } 40% { transform: translate(-1cqw,-1cqw) scale(.9); } }

  /* ---------- Сцена 2: коробка открыта ---------- */
  .open-img {
    position: absolute; bottom: 0; left: -28.85cqw; width: 190cqw; aspect-ratio: 2000 / 1131;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 16%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 16%);
  }
  .open-img > img { width: 100%; height: 100%; display: block; -webkit-user-drag: none; }
  .mouth { position: absolute; left: 48.5%; top: 66%; width: 1px; height: 1px; }

  /* ---------- Кнопки в стиле логотипа ---------- */
  .jbtn {
    position: relative; display: flex; align-items: center; justify-content: center; gap: 2.4cqw;
    width: 100%; padding: 3.6cqw 5cqw 4cqw; border-radius: 99px; cursor: pointer;
    font: 700 4.6cqw/1.1 'Comfortaa', sans-serif; color: #fff; text-decoration: none; text-align: center;
    background: linear-gradient(170deg, #ff8197 0%, var(--pink) 45%, var(--magenta) 100%);
    border: 1cqw solid #fff; box-shadow: 0 0 0 0.9cqw var(--teal), 0 1.6cqw 0 0.9cqw #8f2a63, 0 3cqw 5cqw rgba(184,53,127,.35);
    transition: transform .15s;
  }
  .jbtn::before { /* глянцевый блик */
    content: ''; position: absolute; left: 9%; right: 9%; top: 9%; height: 36%; border-radius: 99px;
    background: linear-gradient(to bottom, rgba(255,255,255,.55), rgba(255,255,255,0)); pointer-events: none;
  }
  .jbtn:active { transform: translateY(1cqw) scale(.97, .94); }
  .jbtn.alt {
    color: var(--magenta); background: linear-gradient(170deg, #fff, #ffeef5);
    box-shadow: 0 0 0 0.9cqw var(--teal), 0 1.4cqw 0 0.9cqw #2a8f9b, 0 2.4cqw 4cqw rgba(59,182,197,.3);
  }
  .jbtn.alt::before { background: linear-gradient(to bottom, rgba(255,255,255,.9), rgba(255,255,255,0)); }
  .jbtn svg { width: 6cqw; height: 6cqw; flex: none; }
  .jbtn.shine::after { /* перелив */
    content: ''; position: absolute; inset: 0; border-radius: 99px; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.65) 50%, transparent 65%) -150% 0 / 250% 100% no-repeat;
    animation: shine 2.8s ease-in-out infinite;
  }
  @keyframes shine { 0%, 40% { background-position: 160% 0; } 100% { background-position: -160% 0; } }

  /* поворот и центровку задаёт GSAP (он перехватывает CSS translate/rotate) */
  .lid-btn {
    position: absolute; left: 31%; top: 43%; width: auto; flex-direction: column; gap: 0.6cqw;
    font-size: 5cqw; line-height: 1.15; padding: 3cqw 6.4cqw 3.4cqw; border-radius: 7cqw;
    opacity: 0;
  }
  .lid-btn::before, .lid-btn.shine::after, .lid-btn .pulse { border-radius: 7cqw; }
  .lid-btn .pulse { position: absolute; inset: -2.4cqw; border-radius: 99px; border: 0.8cqw solid #fff; animation: pulse 1.6s ease-out infinite; pointer-events: none; }
  @keyframes pulse { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.25); opacity: 0; } }

  /* ---------- Сцена 3: внутри коробки ---------- */
  .inside { background: radial-gradient(90% 60% at 50% 30%, #fff 0%, #fff7fa 45%, #fde0ea 100%); }
  .wall { position: absolute; top: 0; bottom: 0; width: 13cqw; }
  .wall.l { left: 0; clip-path: polygon(0 0, 100% 6%, 100% 94%, 0 100%); background: linear-gradient(90deg, #f6a9c2, #fbd3e1); }
  .wall.r { right: 0; clip-path: polygon(0 6%, 100% 0, 100% 100%, 0 94%); background: linear-gradient(270deg, #f6a9c2, #fbd3e1); }
  .wall::after { /* атласные складки */
    content: ''; position: absolute; inset: 0; opacity: .5;
    background: repeating-linear-gradient(180deg, transparent 0 7cqh, rgba(255,255,255,.7) 8cqh, transparent 10cqh);
  }
  .rim { position: absolute; left: 0; right: 0; top: 0; height: 3cqh; background: linear-gradient(#fff, #fde6ee); box-shadow: 0 1cqh 2cqh rgba(184,53,127,.12); }
  .light { position: absolute; left: 50%; top: -20cqh; width: 140cqw; height: 70cqh; translate: -50% 0;
    background: conic-gradient(from 160deg at 50% 0%, transparent, rgba(255,246,200,.6) 8deg, transparent 16deg, rgba(255,255,255,.7) 26deg, transparent 34deg);
    opacity: .6; animation: rays 8s linear infinite alternate; pointer-events: none; }
  @keyframes rays { to { transform: rotate(6deg); } }

  .inside-content {
    position: absolute; inset: 0; padding: 10.5cqh 9cqw 3cqh; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; gap: 3.2cqh;
  }
  .peek { width: min(34cqw, 19cqh); margin-bottom: -1.4cqh; transform-origin: 50% 100%; animation: sway 3.2s ease-in-out infinite; }
  @keyframes sway { 0%,100% { rotate: -3deg; } 50% { rotate: 3deg; } }

  .card {
    position: relative; width: 100%; padding: 6cqw 5.4cqw 5.4cqw; border-radius: 8cqw; text-align: center;
    background: #fff; border: 1cqw solid var(--teal);
    box-shadow: 0 0 0 1.2cqw #fff, 0 0 0 1.6cqw rgba(59,182,197,.18), 0 3cqw 6cqw rgba(184,53,127,.18);
  }
  .card .badge {
    position: absolute; top: -4.6cqw; left: 50%; translate: -50% 0; white-space: nowrap;
    padding: 1.2cqw 4cqw 1.4cqw; border-radius: 99px; font-size: 3.6cqw; font-weight: 700; color: #fff;
    background: linear-gradient(160deg, #6fd3df, var(--teal)); border: 0.8cqw solid #fff; box-shadow: 0 0 0 0.6cqw var(--teal);
  }
  .card .badge.pink { background: linear-gradient(160deg, #ff7d95, var(--magenta)); }
  .card p { margin: 1cqw 0 4cqw; font-size: 4.1cqw; line-height: 1.4; font-weight: 700; }
  .card p small { display: block; margin-top: 1.4cqw; font-size: 3.6cqw; font-weight: 500; opacity: .85; }
  .card .row { display: flex; flex-direction: column; gap: 3.6cqw; }
  .card .jbtn { padding: 3cqw 4cqw 3.4cqw; font-size: 4.3cqw; }
  .replay {
    border: 0; background: none; font: 700 3.6cqw 'Comfortaa', sans-serif; color: var(--magenta); opacity: .7;
    cursor: pointer; padding: 2cqw;
  }

  /* ---------- Частицы и вспышка ---------- */
  .fx { position: absolute; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
  .p { position: absolute; left: 0; top: 0; will-change: transform; }
  .p.gummy { border-radius: 50% 50% 46% 46%; box-shadow: inset -0.6cqw -0.8cqw 0 rgba(0,0,0,.08), inset 0.6cqw 0.6cqw 0 rgba(255,255,255,.55); }
  .p.conf { border-radius: 2px; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }

  .loader { position: absolute; inset: 0; display: grid; place-items: center; z-index: 50; background: var(--blush); transition: opacity .5s; }
  .loader svg { width: 16cqw; animation: beat .9s ease-in-out infinite; }
  @keyframes beat { 50% { transform: scale(1.18); } }

  @media (prefers-reduced-motion: reduce) {
    .float, .dash, .bg .drift-a, .bg .drift-b, .light, .peek { animation: none; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">

  <!-- Фон: волны как на референсе -->
  <svg class="bg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f9c9dc"/><stop offset="1" stop-color="#f3b4cb"/>
      </linearGradient>
    </defs>
    <rect width="900" height="1600" fill="#fbd0e1"/>
    <g class="drift-a">
      <path d="M540 -20 C 760 100 600 430 800 610 C 880 690 920 820 940 900 L940 -20 Z" fill="#c3e7f7"/>
      <path d="M-40 540 C 170 560 270 790 200 1000 C 160 1120 60 1190 -40 1210 Z" fill="#f6b3cb" opacity=".75"/>
    </g>
    <g class="drift-b">
      <path d="M-40 1050 C 110 1030 230 1140 270 1300 L-40 1300 Z" fill="#bfe3f5"/>
      <path d="M560 1290 C 660 1120 790 1080 940 1100 L940 1300 Z" fill="#f6b3cb" opacity=".8"/>
      <path d="M700 760 C 780 700 880 720 940 760 L940 1000 C 860 960 760 900 700 760 Z" fill="#d3eefa"/>
    </g>
    <rect y="1270" width="900" height="330" fill="url(#floor)"/>
    <ellipse cx="450" cy="1300" rx="520" ry="40" fill="#fde2ec" opacity=".8"/>
  </svg>

  <!-- Сердечки и штрихи -->
  <div id="decor" aria-hidden="true"></div>

  <!-- HUD-прогресс -->
  <div class="hud" aria-hidden="true">
    <span class="step on" id="s1">👋</span><span class="line" id="l1"><i></i></span>
    <span class="step" id="s2">🎁</span><span class="line" id="l2"><i></i></span>
    <span class="step" id="s3">🍬</span>
  </div>

  <!-- Язык -->
  <div class="lang" role="group" aria-label="Язык / Til">
    <button data-lang="ru">RU</button><button data-lang="uz">UZ</button>
  </div>

  <!-- Реплика -->
  <div class="bubble" id="bubble" role="status" aria-live="polite">
    <span class="name">Jelly</span>
    <span id="say"></span>
    <div class="dots" id="dots" hidden><i></i><i></i><i></i></div>
    <span class="next" data-i18n="next">тапни ▸</span>
  </div>

  <!-- Сцена 1: Jelly идёт -->
  <section class="scene" id="scene-walk">
    <div class="jelly" id="jelly">
      <div class="j-shadow"></div>
      <div class="rig" id="rig">
        <div class="part j-leg l" id="legL"><img src="assets/jelly-tail.webp" alt=""></div>
        <div class="part j-leg r" id="legR"><img src="assets/jelly-tail.webp" alt=""></div>
        <div class="part j-body" id="jbody"><img src="assets/jelly-tail.webp" alt="Jelly с подарочной коробкой"></div>
      </div>
      <div class="j-glow" id="glow"></div>
      <button class="box-hit" id="boxHit" aria-label="Открыть коробку">
        <span class="tap-ring"></span><span class="tap-hand">👆</span>
      </button>
    </div>
  </section>

  <!-- Сцена 2: коробка открыта -->
  <section class="scene" id="scene-open" hidden>
    <div class="open-img" id="openImg">
      <img src="assets/jelly-open.webp" alt="Jelly открыл коробку">
      <span class="mouth" id="mouth"></span>
      <button class="jbtn shine lid-btn" id="lidBtn"><span class="pulse"></span><span data-i18n="lid1">Хочу</span><span data-i18n="lid2">подарок 🎁</span></button>
    </div>
  </section>

  <!-- Сцена 3: внутри коробки -->
  <section class="scene inside" id="scene-inside" hidden>
    <div class="light"></div>
    <div class="wall l"></div><div class="wall r"></div><div class="rim"></div>
    <div class="inside-content">
      <img class="peek" src="assets/logo.png" alt="Jelly">
      <div class="card">
        <span class="badge" data-i18n="task">⭐ Задание</span>
        <p data-i18n="taskText">Выложи в соцсети распаковку или коробку и&nbsp;отметь&nbsp;меня&nbsp;💕</p>
        <div class="row">

            Instagram: @jelly.uz
          </a>
          <a class="jbtn alt" href="https://t.me/jellyuz" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.4 3.6 2.9 10.8c-1.1.4-1.1 1.6 0 1.9l4.6 1.4 1.8 5.6c.3.8 1.2 1 1.8.4l2.6-2.4 4.9 3.6c.8.5 1.8.1 2-.8l3-14.5c.3-1.3-.9-2.3-2.2-1.8zM9.5 14.6l8.6-7.6-6.9 8.9-.3 3.1-1.4-4.4z"/></svg>

          <small>Напиши менеджеру в приложении бота лояльности</small></p>
        <a class="jbtn shine" href="https://t.me/jellybonus_bot" target="_blank" rel="noopener" data-i18n="getGift">Получить подарок ✨</a>

  <div class="loader" id="loader">
    <svg viewBox="0 0 24 24"><path fill="#f05a78" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>

<script src="assets/js/gsap.min.js"></script><!-- GSAP 3.12.5 -->

<script>
const $ = s => document.querySelector(s);
const stage = $('#stage'), fx = $('#fx'), flash = $('#flash');
const bubble = $('#bubble'), sayEl = $('#say'), dots = $('#dots');
const HEART = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
const COLORS = ['#f05a78', '#ff8fa6', '#3bb6c5', '#8fdbe6', '#b8357f', '#ffd36e', '#fff'];
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- Декор: сердечки и штрихи ---------- */
(() => {
  const decor = $('#decor');
  const hearts = [
    { x: 8, y: 30, s: 13, c: '#f05a78', r: -12, fill: false },
    { x: 78, y: 27, s: 14, c: '#3bb6c5', r: 10, fill: false },
    { x: 82, y: 52, s: 8, c: '#f05a78', r: 8, fill: true },
    { x: 10, y: 60, s: 8, c: '#3bb6c5', r: -6, fill: true },
    { x: 88, y: 72, s: 6, c: '#ff8fa6', r: 14, fill: true },
  ];
  hearts.forEach((h, i) => {
    const el = document.createElement('div');
    el.className = 'float';
    el.style.cssText = `left:${h.x}cqw;top:${h.y}cqh;width:${h.s}cqw;height:${h.s}cqw;--r:${h.r}deg;animation-delay:${-i * .7}s`;
    el.innerHTML = `<svg viewBox="0 0 24 24"><path d="${HEART}" fill="${h.fill ? h.c : 'none'}" stroke="${h.c}" stroke-width="${h.fill ? 0 : 2.2}" stroke-linejoin="round"/></svg>`;
    decor.appendChild(el);
  });
  const dashes = [
    { x: 22, y: 25, w: 9, r: 40, c: '#f7a3bd' }, { x: 70, y: 22, w: 10, r: -50, c: '#fff' },
    { x: 74, y: 33, w: 9, r: -20, c: '#8fdbe6' }, { x: 6, y: 45, w: 10, r: -8, c: '#fff' },
    { x: 8, y: 50, w: 12, r: -18, c: '#8fdbe6' }, { x: 84, y: 62, w: 8, r: -12, c: '#fff' },
  ];
  dashes.forEach((d, i) => {
    const el = document.createElement('i');
    el.className = 'dash';
    el.style.cssText = `left:${d.x}cqw;top:${d.y}cqh;width:${d.w}cqw;background:${d.c};--r:${d.r}deg;animation-delay:${-i * .4}s`;
    decor.appendChild(el);
  });
})();

/* ---------- Частицы ---------- */
function burst(x, y, n = 24, spread = 1) {
  const W = stage.clientWidth;
  for (let i = 0; i < n; i++) {
    const kind = Math.random();
    const el = document.createElement('div');
    const c = COLORS[(Math.random() * COLORS.length) | 0];
    const s = rnd(.03, .065) * W;
    if (kind < .4) {
      el.innerHTML = `<svg viewBox="0 0 24 24" width="${s}" height="${s}"><path d="${HEART}" fill="${c === '#fff' ? '#ff8fa6' : c}"/></svg>`;
      el.className = 'p';
    } else if (kind < .7) {
      el.className = 'p gummy';
      el.style.cssText = `width:${s * .8}px;height:${s}px;background:${c === '#fff' ? '#ffd36e' : c}`;
    } else {
      el.className = 'p conf';
      el.style.cssText = `width:${s * .35}px;height:${s * .7}px;background:${c}`;
    }
    fx.appendChild(el);
    const ang = rnd(-Math.PI * .95, -Math.PI * .05);
    const dist = rnd(.25, .6) * W * spread;
    gsap.set(el, { x, y, xPercent: -50, yPercent: -50, scale: 0 });
    gsap.timeline({ onComplete: () => el.remove() })
      .to(el, { scale: 1, duration: .2, ease: 'back.out(3)' }, 0)
      .to(el, { x: x + Math.cos(ang) * dist, y: y + Math.sin(ang) * dist, rotation: rnd(-260, 260), duration: rnd(.7, 1.1), ease: 'power3.out' }, 0)
      .to(el, { y: `+=${rnd(.25, .5) * W}`, opacity: 0, duration: rnd(.8, 1.3), ease: 'power1.in' }, '>-0.15');
  }
}
function rain(n = 40) {
  const W = stage.clientWidth, H = stage.clientHeight;
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    const c = COLORS[(Math.random() * COLORS.length) | 0];
    const s = rnd(.025, .05) * W;
    if (i % 3 === 0) { el.className = 'p'; el.innerHTML = `<svg viewBox="0 0 24 24" width="${s}" height="${s}"><path d="${HEART}" fill="${c === '#fff' ? '#ff8fa6' : c}"/></svg>`; }
    else { el.className = i % 3 === 1 ? 'p gummy' : 'p conf'; el.style.cssText = `width:${s * .7}px;height:${s}px;background:${c}`; }
    fx.appendChild(el);
    gsap.set(el, { x: rnd(0, W), y: -40, rotation: rnd(0, 360) });
    gsap.to(el, { y: H + 40, x: `+=${rnd(-60, 60)}`, rotation: `+=${rnd(-400, 400)}`, duration: rnd(2.4, 4.2), delay: rnd(0, 1.4), ease: 'none', onComplete: () => el.remove() });
  }
}
function pointOf(el) {
  const a = el.getBoundingClientRect(), b = stage.getBoundingClientRect();
  return { x: a.left - b.left + a.width / 2, y: a.top - b.top + a.height / 2 };
}

/* ---------- Тексты RU / UZ ---------- */
const T = {
  ru: {
    title: 'Jelly — подарок для тебя',
    hello: 'Привет! Спасибо, что попробовал мой мармелад! 🍬✨',
    special: 'Я приготовил для тебя кое-что особенное…',
    tapBox: 'Тапни по коробке 3 раза, чтобы открыть! 🎁',
    tada: 'Та-да! 🎉 Жми кнопку на крышке!',
    next: 'тапни ▸',
    lid1: 'Хочу', lid2: 'подарок 🎁',
    task: '⭐ Задание',
    taskText: 'Выложи в соцсети распаковку или коробку и&nbsp;отметь&nbsp;меня&nbsp;💕',
    reward: '🎁 Награда',
    rewardText: 'Я дарю тебе сладкий промокод на&nbsp;следующий&nbsp;заказ&nbsp;🍬<small>Напиши менеджеру в приложении бота лояльности</small>',
    getGift: 'Получить подарок ✨',
    replay: '↺ Посмотреть ещё раз',
  },
  uz: {
    title: 'Jelly — siz uchun sovg‘a',
    hello: 'Salom! Marmeladimni tatib ko‘rganingiz uchun rahmat! 🍬✨',
    special: 'Men siz uchun maxsus bir narsa tayyorladim…',
    tapBox: 'Ochish uchun qutichani 3 marta bosing! 🎁',
    tada: 'Ta-da! 🎉 Qopqoqdagi tugmani bosing!',
    next: 'bosing ▸',
    lid1: 'Sovg‘a', lid2: 'xohlayman 🎁',
    task: '⭐ Vazifa',
    taskText: 'Quti yoki uning ochilishini ijtimoiy tarmoqlarga joylang va&nbsp;meni&nbsp;belgilang&nbsp;💕',
    reward: '🎁 Mukofot',
    rewardText: 'Keyingi buyurtmangiz uchun sizga shirin promokod sovg‘a&nbsp;qilaman&nbsp;🍬<small>Sodiqlik botida menejerga yozing</small>',
    getGift: 'Sovg‘ani olish ✨',
    replay: '↺ Yana bir bor ko‘rish',
  },
};
let lang = (() => {
  const p = new URLSearchParams(location.search).get('lang');
  if (p === 'ru' || p === 'uz') return p;
  try { const s = localStorage.getItem('jelly-lang'); if (s === 'ru' || s === 'uz') return s; } catch (e) {}
  return (navigator.language || '').toLowerCase().startsWith('uz') ? 'uz' : 'ru';
})();
let sayKey = null;
function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.title = T[l].title;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = T[l][el.dataset.i18n]; });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
  if (sayKey && !typing) sayEl.textContent = T[l][sayKey];
  try { localStorage.setItem('jelly-lang', l); } catch (e) {}
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', e => {
  e.stopPropagation();
  setLang(b.dataset.lang);
}));

/* ---------- Реплики ---------- */
let typing = null, advance = null;
function say(key, { wait = true, auto = 0, showDots = false } = {}) {
  sayKey = key;
  return new Promise(resolve => {
    dots.hidden = !showDots;
    bubble.classList.remove('wait');
    if (gsap.getProperty(bubble, 'opacity') < .5) {
      gsap.fromTo(bubble, { opacity: 0, scale: .6, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: .55, ease: 'back.out(2)' });
    } else {
      gsap.fromTo(bubble, { scale: .96 }, { scale: 1, duration: .4, ease: 'back.out(3)' });
    }
    // текст берётся на каждом шаге — язык можно переключить прямо во время печати
    const chars = () => Array.from(T[lang][key]);
    let i = 0;
    sayEl.textContent = '';
    clearInterval(typing);
    const done = () => {
      clearInterval(typing); typing = null;
      sayEl.textContent = T[lang][key];
      if (!wait) return resolve();
      bubble.classList.add('wait');
      let t = auto ? setTimeout(go, auto) : null;
      function go() { clearTimeout(t); advance = null; bubble.classList.remove('wait'); resolve(); }
      advance = go;
    };
    advance = () => { if (typing) done(); };
    typing = setInterval(() => {
      const c = chars();
      sayEl.textContent = c.slice(0, ++i).join('');
      if (i >= c.length) done();
    }, 34);
  });
}
function hideBubble() { gsap.to(bubble, { opacity: 0, scale: .8, y: 10, duration: .3, ease: 'power2.in' }); }
stage.addEventListener('click', e => {
  if (e.target.closest('a, button')) return;
  if (advance) advance();
});

function hud(step) {
  for (let i = 1; i <= 3; i++) $('#s' + i).classList.toggle('on', i <= step);
  for (let i = 1; i <= 2; i++) $('#l' + i).classList.toggle('on', i < step);
}

/* ---------- Сцена 1: подходит ---------- */
const jelly = $('#jelly'), jbody = $('#jbody');
gsap.set(jelly, { xPercent: -45 }); // тело чуть левее центра картинки — справа хвост
const legL = $('#legL'), legR = $('#legR'), rig = $('#rig');
let idle;

// Поза шага. sin(phase) > 0 — шагает левая нога, < 0 — правая; a — сила (0…1).
// Нога поднимается по s² (касается пола с нулевой скоростью — мягко), тело переносит вес на опорную ногу.
function pose(phase, a) {
  const s = Math.sin(phase);
  const l = a * Math.max(0, s) ** 2, r = a * Math.max(0, -s) ** 2;
  gsap.set(legL, { yPercent: -4.2 * l, scale: 1 + .035 * l, rotation: -4 * l });
  gsap.set(legR, { yPercent: -4.2 * r, scale: 1 + .035 * r, rotation: 4 * r });
  const contact = a * (1 - s * s);
  gsap.set(rig, { rotation: 2 * a * s, xPercent: a * s }); // наклон и перенос веса на опорную ногу
  gsap.set(jbody, {                                         // тело вытягивается на шаге и пружинит при касании
    scaleY: 1 + .02 * a * s * s - .015 * contact,
    scaleX: 1 - .008 * a * s * s + .012 * contact,
  });
}

function walk() {
  return new Promise(resolve => {
    // phase растёт каждый кадр, amp плавно разгоняется и затухает — шаги без рывков
    const gait = { amp: 0, phase: 0 };
    const CYCLE = .9; // секунд на два шага
    const tick = (time, dt) => {
      gait.phase += (Math.PI * 2 / CYCLE) * (dt / 1000) * (.6 + .4 * gait.amp);
      pose(gait.phase, gait.amp);
    };
    gsap.ticker.add(tick);
    gsap.to(gait, { amp: 1, duration: .8, ease: 'sine.inOut' });
    gsap.to(gait, { amp: 0, duration: 1.1, ease: 'sine.inOut', delay: 2.9 });

    gsap.timeline({
      onComplete() {
        gsap.ticker.remove(tick);
        gsap.to([legL, legR], { yPercent: 0, rotation: 0, scale: 1, duration: .3, ease: 'sine.out' });
        gsap.to(rig, { rotation: 0, xPercent: 0, duration: .3, ease: 'sine.out' });
        gsap.timeline()
          .to(jbody, { scaleY: .975, scaleX: 1.015, duration: .25, ease: 'sine.out' })
          .to(jbody, { scaleY: 1, scaleX: 1, duration: .8, ease: 'elastic.out(1, .5)' });
        idle = gsap.to(jbody, { scaleY: 1.015, scaleX: .992, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: .8 });
        setTimeout(resolve, 450);
      }
    })
      .fromTo(jelly, { opacity: 0 }, { opacity: 1, duration: .5 }, 0)
      .fromTo(jelly, { scale: .34, yPercent: -24 }, { scale: 1, yPercent: 0, duration: 4, ease: 'sine.inOut' }, 0);
  });
}

function hop() { // подпрыгивает, когда говорит
  gsap.timeline()
    .to(jelly, { y: -stage.clientHeight * .015, duration: .16, ease: 'power2.out' })
    .to(jelly, { y: 0, duration: .5, ease: 'bounce.out' });
}

let taps = 0;
const boxHit = $('#boxHit'), glow = $('#glow');
function waitForTaps() {
  return new Promise(resolve => {
    boxHit.classList.add('on');
    boxHit.onclick = e => {
      e.stopPropagation();
      taps++;
      dots.querySelectorAll('i').forEach((d, i) => d.classList.toggle('on', i < taps));
      const p = pointOf(boxHit);
      burst(p.x, p.y - stage.clientHeight * .06, 8 + taps * 4, .7);
      gsap.timeline()
        .to(jelly, { rotation: -4, duration: .06 })
        .to(jelly, { rotation: 4, duration: .08, repeat: 3, yoyo: true })
        .to(jelly, { rotation: 0, duration: .2, ease: 'back.out(3)' });
      gsap.to(glow, { opacity: taps / 3, scale: 1 + taps * .12, duration: .4 });
      if (taps >= 3) {
        boxHit.classList.remove('on');
        boxHit.onclick = null;
        setTimeout(resolve, 350);
      }
    };
  });
}

/* ---------- Сцена 2: открытие ---------- */
const openImg = $('#openImg'), lidBtn = $('#lidBtn'), mouth = $('#mouth');
let sparkle;
function openBox() {
  return new Promise(resolve => {
    hideBubble();
    if (idle) idle.kill();
    gsap.timeline()
      .to(jelly, { scale: 1.9, transformOrigin: '50% 60%', duration: .75, ease: 'power2.in' })
      .to(flash, { opacity: 1, duration: .32 }, '-=.32')
      .add(() => {
        $('#scene-walk').hidden = true;
        $('#scene-open').hidden = false;
        hud(2);
      })
      .fromTo(openImg, { scale: 1.2, transformOrigin: '48% 66%' }, { scale: 1, duration: 1.1, ease: 'power3.out' })
      .to(flash, { opacity: 0, duration: .7 }, '<')
      .add(() => {
        const p = pointOf(mouth);
        burst(p.x, p.y, 40, 1.2);
        sparkle = setInterval(() => { const q = pointOf(mouth); burst(q.x, q.y, 3, .55); }, 420);
      }, '<.05')
      .add(resolve, '-=.4');
  });
}

async function showLidButton() {
  await say('tada', { wait: false });
  gsap.set(lidBtn, { xPercent: -50, yPercent: -50, rotation: -22 });
  gsap.fromTo(lidBtn, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 1, ease: 'elastic.out(1, .5)' });
  gsap.to(openImg, { scale: 1.012, duration: 1.8, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: 1 });
  return new Promise(resolve => { lidBtn.onclick = e => { e.stopPropagation(); lidBtn.onclick = null; resolve(); }; });
}

/* ---------- Сцена 3: внутри ---------- */
function dive() {
  return new Promise(resolve => {
    clearInterval(sparkle);
    hideBubble();
    const p = pointOf(mouth);
    gsap.timeline()
      .to(lidBtn, { scale: .85, duration: .1, yoyo: true, repeat: 1 })
      .to(lidBtn, { opacity: 0, duration: .2 })
      .to('#scene-open', { scale: 4, transformOrigin: `${p.x}px ${p.y}px`, duration: 1, ease: 'power2.in' }, '<')
      .to(flash, { opacity: 1, duration: .35 }, '-=.35')
      .add(() => {
        $('#scene-open').hidden = true;
        $('#scene-inside').hidden = false;
        hud(3);
      })
      .to(flash, { opacity: 0, duration: .8 })
      .from('.peek', { yPercent: -60, opacity: 0, duration: .9, ease: 'back.out(1.8)' }, '<')
      .from('.card', { y: 60, scale: .85, opacity: 0, duration: .8, stagger: .18, ease: 'back.out(1.7)' }, '<.2')
      .from('.replay', { opacity: 0, duration: .5 })
      .add(() => { rain(46); resolve(); }, '<-.9');
  });
}

/* ---------- Сценарий ---------- */
async function run() {
  // ?scene=2 / ?scene=3 — сразу открыть нужную сцену (для проверки)
  const jump = new URLSearchParams(location.search).get('scene');
  const fixedPose = new URLSearchParams(location.search).get('pose'); // ?scene=pose&pose=1.57 — замереть в фазе шага
  if (jump === 'pose') { gsap.set(jelly, { opacity: 1 }); pose(+fixedPose, 1); return; }
  if (jump === '1') {
    gsap.set(jelly, { opacity: 1 });
    await say('tapBox', { wait: false, showDots: true });
    await waitForTaps(); await openBox(); await showLidButton(); await dive();
    return;
  }
  if (jump) {
    $('#scene-walk').hidden = true;
    if (jump === '2') { $('#scene-open').hidden = false; hud(2); await showLidButton(); }
    await dive();
    return;
  }
  await walk();
  hop(); await say('hello', { auto: 4200 });
  hop(); await say('special', { auto: 3200 });
  await say('tapBox', { wait: false, showDots: true });
  await waitForTaps();
  await openBox();
  await showLidButton();
  await dive();
}

$('#replay').onclick = () => location.reload();
setLang(lang);

const quick = new URLSearchParams(location.search).has('scene');
if (quick) { gsap.ticker.lagSmoothing(0); $('#loader').remove(); document.body.appendChild(document.createElement('div')).id = 'loader'; }
(quick ? Promise.resolve() : Promise.all([...document.images].map(img => img.decode().catch(() => {}))))
  .then(() => Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]))
  .then(() => {
    gsap.to('#loader', { opacity: 0, duration: .5, onComplete: () => $('#loader').remove() });
    run();
  });
</script>
